<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel de Clubes CETEC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-cetecBlue font-sans text-gray-800 selection:bg-cetecGreen selection:text-white overflow-hidden h-screen w-screen">
    <div class="flex items-center justify-center h-screen w-screen px-4">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-[420px] max-w-full text-center border-b-[8px] border-cetecBlueDark">
            <h1 class="text-3xl font-black text-cetecBlue mb-2 tracking-tight">Painel de Clubes</h1>
            <p class="text-gray-500 font-bold text-sm mb-8">Acesso ao ambiente de gerenciamento CETEC</p>

            <form id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="E-mail" value="123@gmail.com" class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-cetecGreen font-bold text-gray-700" required>
                <input type="password" id="password" placeholder="Senha" value="12345678" class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-cetecGreen font-bold text-gray-700" required>
                <button type="submit" class="btn-3d w-full bg-cetecGreen text-white font-black text-lg py-4 px-4 rounded-2xl border-b-[6px] border-cetecGreenDark hover:bg-[#7ed152]">ENTRAR</button>
                <p id="login-error" class="text-red-500 font-bold text-sm hidden">Credenciais incorretas.</p>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
